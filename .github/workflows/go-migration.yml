name: Go migration contract

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: go-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.repository == 'Daiobs/DokiTool-Go'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_go: ${{ steps.classify.outputs.run_go }}
      run_frontend: ${{ steps.classify.outputs.run_frontend }}
      run_l2_e2e: ${{ steps.classify.outputs.run_l2_e2e }}
    steps:
      - name: Check out trusted base commit for path classification
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR head commit and classify changed paths (fail-closed)
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! git rev-parse --verify --quiet "${PR_HEAD_SHA}^{commit}" >/dev/null \
            || ! git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA" >/dev/null 2>&1; then
            git fetch --no-tags origin "$PR_HEAD_SHA" \
              || git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fi
          python3 -B scripts/classify-ci-changes.py \
            --base="$PR_BASE_SHA" \
            --head="$PR_HEAD_SHA" \
            --github-output="$GITHUB_OUTPUT"

  repo-contracts:
    if: github.repository == 'Daiobs/DokiTool-Go'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Python validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/dokitool-validation"
          "$RUNNER_TEMP/dokitool-validation/bin/python" -m pip install -r scripts/requirements-validation.txt

      - name: Set up Node for offline script unit tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Verify reviewed source inventory
        run: python3 -B scripts/check-public-files.py --staged

      - name: Verify Python scripts, smoke tests, OpenAPI contract, and locked pins
        run: |
          python3 -B -X utf8 scripts/prod-smoke/test_smoke.py
          DOKITOOL_STAGE2_SKIP_BROWSER=1 node --test scripts/prod-smoke/test_stage2_browser.mjs
          python3 -B -X utf8 -m unittest discover -s scripts/tests -v
          python3 -B scripts/check-upstream-updates.py --check-local-pins
          python3 -B scripts/go-migration/test-public-projection.py
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B -X utf8 scripts/test-unified-schema.py
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B -X utf8 scripts/check-openapi.py --require-jsonschema

      - name: Verify Go single-file line budgets
        run: python3 -B scripts/check-go-file-budgets.py

  offline-contract:
    needs: changes
    if: github.repository == 'Daiobs/DokiTool-Go' && needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum

      - name: Set up Node for cross-layer Go-to-frontend consumer checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Go source formatting
        run: |
          unformatted="$(gofmt -l backend/internal backend/cmd)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            while IFS= read -r filename; do
              gofmt -d "$filename"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Install validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/dokitool-validation"
          "$RUNNER_TEMP/dokitool-validation/bin/python" -m pip install -r scripts/requirements-validation.txt
          npm ci --prefix frontend --ignore-scripts --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Verify locked Go dependencies and generated TS stats contract
        working-directory: backend
        run: |
          go mod verify
          go list -mod=readonly -m all
          go run ./cmd/genstatstypes -check -out ../frontend/src/monitor/statsTypes.generated.ts

      - name: Run Go vet and single-pass everyday race test suite (exporting all contracts)
        working-directory: backend
        env:
          DOKITOOL_DENO_BINARY: ${{ runner.temp }}/dokitool-validation/bin/deno
          DOKITOOL_GO_YTDLP_OUTPUT: ${{ runner.temp }}/actual-go-ytdlp.json
          DOKITOOL_PIPIXIA_REPRESENTATION_OUTPUT: ${{ runner.temp }}/pipixia-representation.json
          DOKITOOL_SHANGHAI_EXAMPLES: ${{ runner.temp }}/shanghai-originals.json
          DOKITOOL_PULL_EXAMPLES: ${{ runner.temp }}/shanghai-pull.json
          DOKITOOL_XHS_PUBLIC_INTEGRATION_OUTPUT: ${{ runner.temp }}/xhs-live-delivery.json
        run: |
          go vet ./...
          # Schedule the slowest package (internal/shresolver, ~53s) first so all
          # remaining packages execute in parallel behind it without dropping any package.
          mapfile -t all_pkgs < <(go list -mod=readonly ./...)
          ordered_pkgs=()
          for pkg in "${all_pkgs[@]}"; do
            if [[ "$pkg" == */internal/shresolver ]]; then
              ordered_pkgs+=("$pkg")
            fi
          done
          for pkg in "${all_pkgs[@]}"; do
            if [[ "$pkg" != */internal/shresolver ]]; then
              ordered_pkgs+=("$pkg")
            fi
          done
          test "${#ordered_pkgs[@]}" -eq "${#all_pkgs[@]}"
          go test -mod=readonly -race -count=1 "${ordered_pkgs[@]}"

      - name: Validate exported Go contracts against unified schema and frontend consumers
        env:
          DOKITOOL_GO_YTDLP_OUTPUT: ${{ runner.temp }}/actual-go-ytdlp.json
          DOKITOOL_PIPIXIA_REPRESENTATION_OUTPUT: ${{ runner.temp }}/pipixia-representation.json
          DOKITOOL_SHANGHAI_EXAMPLES: ${{ runner.temp }}/shanghai-originals.json
          DOKITOOL_PULL_EXAMPLES: ${{ runner.temp }}/shanghai-pull.json
          DOKITOOL_XHS_PUBLIC_INTEGRATION_OUTPUT: ${{ runner.temp }}/xhs-live-delivery.json
        run: |
          for exported in \
            "$DOKITOOL_GO_YTDLP_OUTPUT" \
            "$DOKITOOL_PIPIXIA_REPRESENTATION_OUTPUT" \
            "$DOKITOOL_SHANGHAI_EXAMPLES" \
            "$DOKITOOL_PULL_EXAMPLES" \
            "$DOKITOOL_XHS_PUBLIC_INTEGRATION_OUTPUT"; do
            test -s "$exported"
          done
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B scripts/validate-unified-schema.py "$DOKITOOL_GO_YTDLP_OUTPUT"
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B scripts/validate-unified-schema.py "$DOKITOOL_SHANGHAI_EXAMPLES"
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B scripts/validate-unified-schema.py "$DOKITOOL_PULL_EXAMPLES"
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B scripts/validate-unified-schema.py "$DOKITOOL_XHS_PUBLIC_INTEGRATION_OUTPUT"
          node frontend/scripts/test-pipixia-representation.mjs "$DOKITOOL_PIPIXIA_REPRESENTATION_OUTPUT"
          node frontend/scripts/test-shanghai-original.mjs "$DOKITOOL_SHANGHAI_EXAMPLES"
          node frontend/scripts/test-shanghai-original.mjs "$DOKITOOL_PULL_EXAMPLES"
          (cd frontend && node --test tests/golden-fixtures-l1.test.mjs && node --test --test-name-pattern='Go public XHS live pairs' tests/ui-download-contract.test.mjs)

      - name: Build Go executables (dokitool and shanghai-resolver)
        working-directory: backend
        run: |
          go build -mod=readonly -o "$RUNNER_TEMP/shanghai-resolver" ./cmd/shanghai-resolver
          go build -mod=readonly -o "$RUNNER_TEMP/dokitool-go" ./cmd/dokitool

  frontend-and-browser:
    needs: changes
    if: github.repository == 'Daiobs/DokiTool-Go' && needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node for the frontend build and tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Set up the pinned Go toolchain for cross-layer consumer exports
        if: needs.changes.outputs.run_go != 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: |
            backend/go.mod
            backend/go.sum

      - name: Verify Go-to-frontend cross-layer consumers (when offline-contract is skipped)
        if: needs.changes.outputs.run_go != 'true'
        env:
          DOKITOOL_PIPIXIA_REPRESENTATION_OUTPUT: ${{ runner.temp }}/pipixia-representation.json
          DOKITOOL_SHANGHAI_EXAMPLES: ${{ runner.temp }}/shanghai-originals.json
          DOKITOOL_PULL_EXAMPLES: ${{ runner.temp }}/shanghai-pull.json
          DOKITOOL_XHS_PUBLIC_INTEGRATION_OUTPUT: ${{ runner.temp }}/xhs-live-delivery.json
        run: |
          (
            cd backend
            go test -mod=readonly -count=1 \
              ./internal/platform/pipixia \
              ./internal/platform/douyin \
              ./internal/shresolver \
              ./cmd/dokitool \
              -run '^(TestPipixiaRepresentationExport|TestShanghaiOriginalSelectionAndRefresh|TestPullDeliveryFrontendExamples|TestXHSPublicMediaIntegration)$'
          )
          for exported in \
            "$DOKITOOL_PIPIXIA_REPRESENTATION_OUTPUT" \
            "$DOKITOOL_SHANGHAI_EXAMPLES" \
            "$DOKITOOL_PULL_EXAMPLES" \
            "$DOKITOOL_XHS_PUBLIC_INTEGRATION_OUTPUT"; do
            test -s "$exported"
          done
          node frontend/scripts/test-pipixia-representation.mjs "$DOKITOOL_PIPIXIA_REPRESENTATION_OUTPUT"
          node frontend/scripts/test-shanghai-original.mjs "$DOKITOOL_SHANGHAI_EXAMPLES"
          node frontend/scripts/test-shanghai-original.mjs "$DOKITOOL_PULL_EXAMPLES"
          (cd frontend && node --test tests/golden-fixtures-l1.test.mjs && node --test --test-name-pattern='Go public XHS live pairs' tests/ui-download-contract.test.mjs)

      - name: Typecheck and test the frontend and download lifecycle
        working-directory: frontend
        run: |
          npm run typecheck
          npm test

      - name: Build frontend production bundle and enforce load budget
        working-directory: frontend
        run: |
          VITE_API_MODE=php VITE_API_BASE_URL='' npm run build
          npm run check:load-budget

      - name: Start the isolated browser delivery fixtures
        run: |
          node scripts/test-download-browser.mjs serve "$RUNNER_TEMP/download-check" >"$RUNNER_TEMP/download-fixture.log" 2>&1 &
          echo "DOWNLOAD_FIXTURE_PID=$!" >> "$GITHUB_ENV"

      - name: Start Chrome with an isolated profile
        run: |
          google-chrome --headless=new --remote-debugging-port=0 --user-data-dir="$RUNNER_TEMP/download-profile" about:blank >"$RUNNER_TEMP/download-chrome.log" 2>&1 &
          echo "DOWNLOAD_CHROME_PID=$!" >> "$GITHUB_ENV"

      - name: Verify cross-origin streaming and browser-saved filenames
        run: |
          for attempt in {1..30}; do
            if test -s "$RUNNER_TEMP/download-check/servers.json" && test -s "$RUNNER_TEMP/download-profile/DevToolsActivePort"; then break; fi
            sleep 1
          done
          node scripts/test-download-browser.mjs check "$RUNNER_TEMP/download-check" "$RUNNER_TEMP/download-profile"

      - name: Stop the browser fixtures
        if: always()
        run: |
          for pid in "${DOWNLOAD_CHROME_PID:-}" "${DOWNLOAD_FIXTURE_PID:-}"; do
            if test -n "$pid"; then kill "$pid" 2>/dev/null || true; fi
          done

      - name: Verify Stage-2 browser smoke tool (offline unit + loopback headless Chrome)
        env:
          DOKITOOL_STAGE2_REQUIRE_BROWSER: '1'
        run: node --test scripts/prod-smoke/test_stage2_browser.mjs

      - name: Run L2 real-extension 6-prototype, SW deadlock, and filename-conflict E2E suite
        if: needs.changes.outputs.run_l2_e2e == 'true'
        run: node scripts/test-download-browser.mjs check-extension-e2e "$RUNNER_TEMP/l2-extension-e2e"

  xhs-dependency-review:
    needs: changes
    if: github.repository == 'Daiobs/DokiTool-Go' && needs.changes.outputs.run_go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Independently reproduce and verify the module lock
        run: |
          mkdir -p "$RUNNER_TEMP/xhs-review" "$RUNNER_TEMP/xhs-module"
          cp -a backend/. "$RUNNER_TEMP/xhs-module/"
          cd "$RUNNER_TEMP/xhs-module"
          go mod tidy
          cp go.mod go.sum "$RUNNER_TEMP/xhs-review/"
          go list -m -json all > "$RUNNER_TEMP/xhs-review/modules.json"
          go mod verify
          cmp "$GITHUB_WORKSPACE/backend/go.mod" go.mod
          cmp "$GITHUB_WORKSPACE/backend/go.sum" go.sum
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: xhs-module-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/xhs-review
          retention-days: 7
          if-no-files-found: error

  ci-summary:
    needs:
      - changes
      - repo-contracts
      - offline-contract
      - frontend-and-browser
      - xhs-dependency-review
    if: always() && github.repository == 'Daiobs/DokiTool-Go'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce path-gated CI job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_CONTRACTS_RESULT: ${{ needs.repo-contracts.result }}
          OFFLINE_CONTRACT_RESULT: ${{ needs.offline-contract.result }}
          FRONTEND_AND_BROWSER_RESULT: ${{ needs.frontend-and-browser.result }}
          XHS_DEPENDENCY_REVIEW_RESULT: ${{ needs.xhs-dependency-review.result }}
          RUN_GO: ${{ needs.changes.outputs.run_go }}
          RUN_FRONTEND: ${{ needs.changes.outputs.run_frontend }}
          RUN_L2_E2E: ${{ needs.changes.outputs.run_l2_e2e }}
        run: |
          set -euo pipefail
          failed=0

          changes_result="${CHANGES_RESULT:-}"
          repo_contracts_result="${REPO_CONTRACTS_RESULT:-}"
          offline_contract_result="${OFFLINE_CONTRACT_RESULT:-}"
          frontend_and_browser_result="${FRONTEND_AND_BROWSER_RESULT:-}"
          xhs_dependency_review_result="${XHS_DEPENDENCY_REVIEW_RESULT:-}"
          run_go="${RUN_GO:-}"
          run_frontend="${RUN_FRONTEND:-}"
          run_l2_e2e="${RUN_L2_E2E:-}"

          echo "CI summary:"
          echo "  changes=${changes_result}"
          echo "  repo-contracts=${repo_contracts_result}"
          echo "  offline-contract=${offline_contract_result} (run_go=${run_go})"
          echo "  xhs-dependency-review=${xhs_dependency_review_result} (run_go=${run_go})"
          echo "  frontend-and-browser=${frontend_and_browser_result} (run_frontend=${run_frontend}, run_l2_e2e=${run_l2_e2e})"

          assert_eq() {
            local label="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::${label}: expected '${expected}', got '${actual}'"
              failed=1
            fi
          }

          assert_eq "changes" "$changes_result" "success"
          assert_eq "repo-contracts" "$repo_contracts_result" "success"

          case "$run_go" in
            true)
              assert_eq "offline-contract (run_go=true)" "$offline_contract_result" "success"
              assert_eq "xhs-dependency-review (run_go=true)" "$xhs_dependency_review_result" "success"
              ;;
            false)
              assert_eq "offline-contract (run_go=false)" "$offline_contract_result" "skipped"
              assert_eq "xhs-dependency-review (run_go=false)" "$xhs_dependency_review_result" "skipped"
              ;;
            *)
              echo "::error::unexpected or missing changes.outputs.run_go='${run_go}' (expected 'true' or 'false')"
              failed=1
              ;;
          esac

          case "$run_frontend" in
            true)
              assert_eq "frontend-and-browser (run_frontend=true)" "$frontend_and_browser_result" "success"
              ;;
            false)
              assert_eq "frontend-and-browser (run_frontend=false)" "$frontend_and_browser_result" "skipped"
              ;;
            *)
              echo "::error::unexpected or missing changes.outputs.run_frontend='${run_frontend}' (expected 'true' or 'false')"
              failed=1
              ;;
          esac

          case "$run_l2_e2e" in
            true|false)
              if [ "$run_l2_e2e" = "true" ] && [ "$run_frontend" != "true" ]; then
                echo "::error::invalid classifier outputs: run_l2_e2e=true requires run_frontend=true (got run_frontend='${run_frontend}')"
                failed=1
              fi
              ;;
            *)
              echo "::error::unexpected or missing changes.outputs.run_l2_e2e='${run_l2_e2e}' (expected 'true' or 'false')"
              failed=1
              ;;
          esac

          exit "$failed"
