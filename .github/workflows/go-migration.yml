name: Go migration contract

on:
  pull_request:
    branches:
      - main
      - codex/go-backend-migration
      - codex/fix-public-media-projection
      - codex/bilibili-go-migration
      - codex/remaining-platforms-go-migration
      - codex/xhs-page-transport
      - codex/download-delivery-closeout
      - codex/renewal-selection-stability
      - chat/product-refresh-closeout
      - dot/same-host-credential-recovery-product
    paths:
      - backend/**
      - frontend/**
      - scripts/**
      - docs/schema/**
      - ops/examples/snap.caddy
      - ops/examples/runtime.example.json
      - .github/workflows/go-migration.yml
      - .github/workflows/php-oracle.yml
      - .github/workflows/release-build.yml
      - .github/workflows/gateway-isolation.yml
      - .github/workflows/upstream-watch.yml
      - public-files.json
      - .gitignore

permissions:
  contents: read

concurrency:
  group: go-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-contract:
    if: github.repository == 'Daiobs/DokiTool-Go'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Set up Node for the frontend consumer
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Go source formatting
        run: |
          unformatted="$(gofmt -l backend/internal backend/cmd)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            while IFS= read -r filename; do
              gofmt -d "$filename"
            done <<< "$unformatted"
            exit 1
          fi

      - name: Install validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/dokitool-validation"
          "$RUNNER_TEMP/dokitool-validation/bin/python" -m pip install -r scripts/requirements-validation.txt
          npm ci --prefix frontend --ignore-scripts --registry=https://registry.npmjs.org --replace-registry-host=always

      - name: Verify reviewed source inventory
        run: python3 -B scripts/check-public-files.py --staged

      - name: Verify Python scripts, smoke tests, OpenAPI contract, and locked pins
        run: |
          python3 -B -X utf8 scripts/prod-smoke/test_smoke.py
          python3 -B -X utf8 -m unittest discover -s scripts/tests -v
          python3 -B scripts/check-upstream-updates.py --check-local-pins
          python3 -B scripts/go-migration/test-public-projection.py
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B -X utf8 scripts/test-unified-schema.py
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B -X utf8 scripts/check-openapi.py --require-jsonschema

      - name: Verify locked Go dependencies and generated TS stats contract
        working-directory: backend
        run: |
          go mod verify
          go list -mod=readonly -m all
          go run ./cmd/genstatstypes -check -out ../frontend/src/monitor/statsTypes.generated.ts

      - name: Run Go vet and full everyday race test suite (frozen PHP oracles live in php-oracle.yml)
        working-directory: backend
        env:
          DOKITOOL_GO_YTDLP_OUTPUT: ${{ runner.temp }}/actual-go-ytdlp.json
          DOKITOOL_DENO_BINARY: ${{ runner.temp }}/dokitool-validation/bin/deno
        run: |
          go vet ./...
          go test -mod=readonly -race -count=1 ./...

      - name: Validate yt-dlp unified schema export
        run: |
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B scripts/validate-unified-schema.py "$RUNNER_TEMP/actual-go-ytdlp.json"

      - name: Verify Pipixia representation changes through the frontend
        run: |
          export DOKITOOL_PIPIXIA_REPRESENTATION_OUTPUT="$RUNNER_TEMP/pipixia-representation.json"
          (cd backend && go test -count=1 ./internal/platform/pipixia -run TestPipixiaRepresentation)
          node frontend/scripts/test-pipixia-representation.mjs "$DOKITOOL_PIPIXIA_REPRESENTATION_OUTPUT"

      - name: Verify Shanghai original resolver, Go responses and frontend consumer
        run: |
          export DOKITOOL_PULL_EXAMPLES="$RUNNER_TEMP/shanghai-pull.json"
          export DOKITOOL_SHANGHAI_EXAMPLES="$RUNNER_TEMP/shanghai-originals.json"
          (
            cd backend
            go vet ./internal/shresolver ./internal/probe ./internal/platform/douyin ./internal/fetch ./internal/unified ./cmd/shanghai-resolver ./cmd/dokitool
            go test -race -count=1 ./internal/shresolver ./internal/probe ./internal/platform/douyin ./internal/fetch ./cmd/shanghai-resolver ./cmd/dokitool
            go build -o "$RUNNER_TEMP/shanghai-resolver" ./cmd/shanghai-resolver
          )
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B scripts/validate-unified-schema.py "$DOKITOOL_SHANGHAI_EXAMPLES"
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B scripts/validate-unified-schema.py "$DOKITOOL_PULL_EXAMPLES"
          node frontend/scripts/test-shanghai-original.mjs "$DOKITOOL_SHANGHAI_EXAMPLES"
          node frontend/scripts/test-shanghai-original.mjs "$DOKITOOL_PULL_EXAMPLES"

      - name: Validate Xiaohongshu live photo delivery through the frontend
        env:
          DOKITOOL_XHS_PUBLIC_INTEGRATION_OUTPUT: ${{ runner.temp }}/xhs-live-delivery.json
        run: |
          (cd backend && go test -count=1 ./cmd/dokitool -run '^TestXHSPublicMediaIntegration$')
          "$RUNNER_TEMP/dokitool-validation/bin/python" -B scripts/validate-unified-schema.py "$DOKITOOL_XHS_PUBLIC_INTEGRATION_OUTPUT"
          (cd frontend && node --test --test-name-pattern='Go public XHS live pairs' tests/ui-download-contract.test.mjs)

      - name: Build the Go executable
        working-directory: backend
        run: go build -o "$RUNNER_TEMP/dokitool-go" ./cmd/dokitool

      - name: Typecheck and test the frontend and download lifecycle
        working-directory: frontend
        run: |
          npm run typecheck
          npm test

      - name: Build frontend production bundle and enforce load budget
        working-directory: frontend
        run: |
          VITE_API_MODE=php VITE_API_BASE_URL='' npm run build
          npm run check:load-budget

      - name: Start the isolated browser delivery fixtures
        run: |
          node scripts/test-download-browser.mjs serve "$RUNNER_TEMP/download-check" >"$RUNNER_TEMP/download-fixture.log" 2>&1 &
          echo "DOWNLOAD_FIXTURE_PID=$!" >> "$GITHUB_ENV"

      - name: Start Chrome with an isolated profile
        run: |
          google-chrome --headless=new --remote-debugging-port=0 --user-data-dir="$RUNNER_TEMP/download-profile" about:blank >"$RUNNER_TEMP/download-chrome.log" 2>&1 &
          echo "DOWNLOAD_CHROME_PID=$!" >> "$GITHUB_ENV"

      - name: Verify cross-origin streaming and browser-saved filenames
        run: |
          for attempt in {1..30}; do
            if test -s "$RUNNER_TEMP/download-check/servers.json" && test -s "$RUNNER_TEMP/download-profile/DevToolsActivePort"; then break; fi
            sleep 1
          done
          node scripts/test-download-browser.mjs check "$RUNNER_TEMP/download-check" "$RUNNER_TEMP/download-profile"

      - name: Stop the browser fixtures
        if: always()
        run: |
          for pid in "${DOWNLOAD_CHROME_PID:-}" "${DOWNLOAD_FIXTURE_PID:-}"; do
            if test -n "$pid"; then kill "$pid" 2>/dev/null || true; fi
          done

  xhs-dependency-review:
    if: github.repository == 'Daiobs/DokiTool-Go'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Independently reproduce and verify the module lock
        run: |
          mkdir -p "$RUNNER_TEMP/xhs-review" "$RUNNER_TEMP/xhs-module"
          cp -a backend/. "$RUNNER_TEMP/xhs-module/"
          cd "$RUNNER_TEMP/xhs-module"
          go mod tidy
          cp go.mod go.sum "$RUNNER_TEMP/xhs-review/"
          go list -m -json all > "$RUNNER_TEMP/xhs-review/modules.json"
          go mod verify
          cmp "$GITHUB_WORKSPACE/backend/go.mod" go.mod
          cmp "$GITHUB_WORKSPACE/backend/go.sum" go.sum
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: xhs-module-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/xhs-review
          retention-days: 7
          if-no-files-found: error
